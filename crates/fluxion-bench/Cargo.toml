[package]
name = "fluxion-bench"
description = "Benchmark harness for the Fluxion execution engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
experimental-work-stealing = ["fluxion-core/experimental-work-stealing"]

[dev-dependencies]
criterion.workspace = true
fluxion-core = { workspace = true, features = ["bench-internals"] }

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "scheduling_eval"
harness = false

[[bench]]
name = "work_stealing_eval"
harness = false
required-features = ["experimental-work-stealing"]
