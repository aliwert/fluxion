name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check --workspace --all-targets --all-features --locked

  source-debug:
    name: Python source debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install "maturin==1.16.0" "pytest==9.2.0"
      - run: .venv/bin/python -m maturin develop --locked
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/python -m pytest tests/python -q -p no:cacheprovider
      - name: Asyncio debug checks
        env:
          PYTHONASYNCIODEBUG: "1"
        run: .venv/bin/python -W error::RuntimeWarning -m pytest tests/python/test_api.py -q -p no:cacheprovider

  wheels-macos:
    name: macOS arm64 wheel / Python ${{ matrix.python-version }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin==1.16.0" "pytest==9.2.0" "mypy==2.4.1"
      - run: python -m maturin build --release --locked --out dist
      - run: python scripts/check_wheel.py dist/*.whl --python-version "${{ matrix.python-version }}" --platform macos-arm64
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel import
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pathlib, fluxion, fluxion._core; path = pathlib.Path(fluxion.__file__).resolve(); print(path); assert 'site-packages' in path.parts"
      - name: Verify NumPy is absent
        working-directory: ${{ runner.temp }}
        run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None, 'NumPy unexpectedly installed'"
      - name: Test wheel without NumPy
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -p no:cacheprovider
      - name: Asyncio debug checks
        working-directory: ${{ runner.temp }}
        env:
          PYTHONASYNCIODEBUG: "1"
        run: python -W error::RuntimeWarning -m pytest "$GITHUB_WORKSPACE/tests/python/test_api.py" -q -p no:cacheprovider
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Test wheel with NumPy
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -p no:cacheprovider
      - name: Validate installed typing
        working-directory: ${{ runner.temp }}
        run: |
          python -m mypy --no-incremental -p fluxion
          python -m mypy.stubtest fluxion
          python -m pip check

  wheels-linux:
    name: Linux x86_64 wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          manylinux: 2_17
          args: --release --locked --out dist -i python${{ matrix.python-version }}
      - run: python -m pip install "pytest==9.2.0" "mypy==2.4.1"
      - run: python scripts/check_wheel.py dist/*.whl --python-version "${{ matrix.python-version }}" --platform linux-x86_64
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel import
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pathlib, fluxion, fluxion._core; path = pathlib.Path(fluxion.__file__).resolve(); print(path); assert 'site-packages' in path.parts"
      - name: Verify NumPy is absent
        working-directory: ${{ runner.temp }}
        run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None, 'NumPy unexpectedly installed'"
      - name: Test wheel without NumPy
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -p no:cacheprovider
      - name: Asyncio debug checks
        working-directory: ${{ runner.temp }}
        env:
          PYTHONASYNCIODEBUG: "1"
        run: python -W error::RuntimeWarning -m pytest "$GITHUB_WORKSPACE/tests/python/test_api.py" -q -p no:cacheprovider
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Test wheel with NumPy
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -p no:cacheprovider
      - name: Validate installed typing
        working-directory: ${{ runner.temp }}
        run: |
          python -m mypy --no-incremental -p fluxion
          python -m mypy.stubtest fluxion
          python -m pip check
