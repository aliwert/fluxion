[workspace]
resolver = "3"
members = [
    "crates/fluxion-core",
    "crates/fluxion-python",
    "crates/fluxion-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/aliwert/fluxion"

[workspace.dependencies]
fluxion-core = { path = "crates/fluxion-core" }
pyo3 = { version = "0.27", features = ["extension-module"] }
thiserror = "2"
